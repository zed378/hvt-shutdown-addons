{{- if and .Values.poweronSchedule .Values.poweronSchedule.enabled }}
# Scheduled power-on: an in-cluster CronJob that triggers IPMI baremetal power-on
# and boots target VirtualMachines once the physical nodes are Ready.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.daemonset.name }}-poweron-schedule
  namespace: {{ .Values.daemonset.namespace }}
  labels:
    app: node-shutdown
spec:
  schedule: {{ .Values.poweronSchedule.nodeCron | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: node-poweron-schedule
        spec:
          serviceAccountName: {{ .Values.rbac.serviceAccountName }}
          restartPolicy: Never
          containers:
            - name: trigger
              image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              env:
                - name: AUTH_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secret.name }}
                      key: {{ .Values.secret.key }}
                - name: API_URL
                  value: "{{ if .Values.tls.enabled }}https{{ else }}http{{ end }}://{{ .Values.daemonset.name }}-nodeport.{{ .Values.daemonset.namespace }}.svc:{{ .Values.nodePort.port }}"
                - name: TARGET_NODES
                  value: {{ .Values.poweronSchedule.nodes | default list | toJson | quote }}
                - name: TARGET_VMS
                  value: {{ .Values.poweronSchedule.vms | default list | toJson | quote }}
                - name: NODE_BMC
                  value: {{ .Values.nodeBmc | default dict | toJson | quote }}
                - name: WAIT_FOR_READY
                  value: {{ .Values.poweronSchedule.waitForReady | default true | quote }}
                - name: TIMEOUT_SECONDS
                  value: {{ .Values.poweronSchedule.timeoutSeconds | default 300 | quote }}
                {{- if .Values.ipmi }}
                - name: IPMI_USER
                  value: {{ .Values.ipmi.user | default "admin" | quote }}
                {{- if .Values.ipmi.password }}
                - name: IPMI_PASSWORD
                  value: {{ .Values.ipmi.password | quote }}
                {{- end }}
                {{- end }}
              command: ["python", "-c"]
              args:
                - |
                  import json, os, ssl, urllib.request
                  token = os.environ["AUTH_TOKEN"]
                  nodes = json.loads(os.environ.get("TARGET_NODES", "[]"))
                  vms = json.loads(os.environ.get("TARGET_VMS", "[]"))
                  node_bmc = json.loads(os.environ.get("NODE_BMC", "{}"))
                  user = os.environ.get("IPMI_USER", "admin")
                  pwd = os.environ.get("IPMI_PASSWORD", "")
                  wait_ready = os.environ.get("WAIT_FOR_READY", "true").lower() == "true"
                  timeout = int(os.environ.get("TIMEOUT_SECONDS", "300"))
                  url = os.environ["API_URL"].rstrip("/") + "/system/poweron"
                  payload = {
                      "nodes": nodes,
                      "vms": vms,
                      "nodeBmc": node_bmc,
                      "ipmiUser": user,
                      "ipmiPassword": pwd,
                      "waitForReady": wait_ready,
                      "timeoutSeconds": timeout
                  }
                  body = json.dumps(payload).encode()
                  ctx = None
                  if url.startswith("https"):
                      ctx = ssl.create_default_context()
                      ctx.check_hostname = False
                      ctx.verify_mode = ssl.CERT_NONE
                  req = urllib.request.Request(
                      url, method="POST", data=body,
                      headers={"Authorization": "Bearer " + token, "Content-Type": "application/json"})
                  print("Triggering scheduled power-on:", {"nodes": nodes, "vms": vms})
                  print(urllib.request.urlopen(req, timeout=30, context=ctx).read().decode())
{{- end }}
