{{- /*
BMC (IPMI / Redfish) connection config for baremetal power-on, mounted into the
DaemonSet at /etc/bmc/bmc.json. Keeps BMC passwords out of pod env vars and out
of the CronJob specs; the API resolves a node's BMC from here by node name.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.bmc.secretName }}
  namespace: {{ .Values.daemonset.namespace }}
  labels:
    app: node-shutdown
type: Opaque
data:
  bmc.json: {{ dict
      "defaults" (dict
        "protocol" (.Values.bmc.protocol | default "ipmi")
        "user" (.Values.ipmi.user | default "admin")
        "password" (.Values.ipmi.password | default ""))
      "nodes" (.Values.nodeBmc | default dict)
    | toJson | b64enc | quote }}
